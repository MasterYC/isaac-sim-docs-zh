<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="467" viewBox="95 62 460 358"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar-x" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d1403f"/>
    </marker>
    <marker id="ar-y" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4caf50"/>
    </marker>
    <marker id="ar-z" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3d7dd8"/>
    </marker>
    <marker id="ar-dim" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555555"/>
    </marker>
    <marker id="ar-dim-s" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#ffffff"/>

  <!-- ===== chassis ===== -->
  <rect x="245" y="120" width="110" height="220" rx="16"
        fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>

  <!-- ===== axle line through both wheel centres ===== -->
  <line x1="234" y1="200" x2="366" y2="200" stroke="#6c8ebf" stroke-width="1.4" stroke-dasharray="5 4"/>

  <!-- ===== wheels ===== -->
  <rect x="223" y="178" width="22" height="44" rx="3" fill="#4d4d4d" stroke="#333333" stroke-width="1.5"/>
  <rect x="355" y="178" width="22" height="44" rx="3" fill="#4d4d4d" stroke="#333333" stroke-width="1.5"/>

  <text x="215" y="197" text-anchor="end" font-size="13" font-weight="bold" fill="#333333">left_wheel_joint</text>
  <text x="215" y="213" text-anchor="end" font-size="11.5" fill="#777777">(+Y side)</text>

  <text x="385" y="197" font-size="13" font-weight="bold" fill="#333333">right_wheel_joint</text>
  <text x="385" y="213" font-size="11.5" fill="#777777">(−Y side)</text>

  <!-- ===== root prim, offset from the control point ===== -->
  <line x1="300" y1="208" x2="300" y2="282" stroke="#888888" stroke-width="1.3"
        stroke-dasharray="4 3" marker-start="url(#ar-dim-s)" marker-end="url(#ar-dim)"/>
  <text x="292" y="249" text-anchor="end" font-size="11.5" fill="#777777">offset</text>

  <circle cx="300" cy="290" r="5.5" fill="#888888" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="307" y1="290" x2="399" y2="290" stroke="#aaaaaa" stroke-width="1"/>
  <text x="405" y="287" font-size="12.5" font-weight="bold" fill="#555555">prim root</text>
  <text x="405" y="302" font-size="11.5" fill="#888888">(e.g. base_link / COM)</text>

  <!-- ===== +X forward axis ===== -->
  <line x1="300" y1="192" x2="300" y2="112" stroke="#d1403f" stroke-width="2.4" marker-end="url(#ar-x)"/>
  <text x="300" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#d1403f">+X forward</text>
  <text x="300" y="83" text-anchor="middle" font-size="11.5" fill="#999999">v = linear_velocities</text>

  <!-- ===== +Y axis ===== -->
  <line x1="292" y1="200" x2="252" y2="200" stroke="#4caf50" stroke-width="2.4" marker-end="url(#ar-y)"/>
  <text x="266" y="189" text-anchor="middle" font-size="13" font-weight="bold" fill="#4caf50">+Y</text>

  <!-- ===== yaw about +Z ===== -->
  <path d="M 317 229 A 34 34 0 0 0 317 171" fill="none" stroke="#3d7dd8"
        stroke-width="2.2" marker-end="url(#ar-z)"/>
  <text x="392" y="248" font-size="13" font-weight="bold" fill="#3d7dd8">+Z up (out of page)</text>
  <text x="392" y="263" font-size="11.5" fill="#999999">ω = angular_velocities</text>

  <!-- ===== control point marker (also the +Z out-of-page symbol) ===== -->
  <line x1="309" y1="192" x2="386" y2="146" stroke="#e0b060" stroke-width="1"/>
  <circle cx="300" cy="200" r="11" fill="#ffffff" stroke="#d79b00" stroke-width="2.6"/>
  <circle cx="300" cy="200" r="3.6" fill="#d79b00"/>
  <text x="392" y="143" font-size="14" font-weight="bold" fill="#d79b00">control_point</text>
  <text x="392" y="158" font-size="11.5" fill="#999999">midway between the wheels</text>

  <!-- ===== wheel_base dimension ===== -->
  <line x1="234" y1="228" x2="234" y2="406" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="366" y1="228" x2="366" y2="406" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="234" y1="398" x2="366" y2="398" stroke="#555555" stroke-width="1.4"
        marker-start="url(#ar-dim-s)" marker-end="url(#ar-dim)"/>
  <text x="300" y="390" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555555">wheel_base (b)</text>
</svg>
