<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="536" viewBox="130 35 350 375"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="m-x" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d1403f"/>
    </marker>
    <marker id="m-y" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4caf50"/>
    </marker>
    <marker id="m-w" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3d7dd8"/>
    </marker>
    <marker id="m-o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9673a6"/>
    </marker>
  </defs>
  <rect x="130" y="35" width="350" height="375" fill="#ffffff"/>

  <!-- chassis -->
  <circle cx="300" cy="260" r="120" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>

  <!-- wheels, tangent to the chassis -->
  <rect x="174" y="192" width="44" height="16" rx="3" fill="#4d4d4d" transform="rotate(120 196 200)"/>
  <rect x="278" y="372" width="44" height="16" rx="3" fill="#4d4d4d"/>
  <rect x="382" y="192" width="44" height="16" rx="3" fill="#4d4d4d" transform="rotate(60 404 200)"/>

  <!-- the default site: origin of the frame the wheels were measured in -->
  <circle cx="300" cy="260" r="7" fill="none" stroke="#999999" stroke-width="2"/>
  <circle cx="300" cy="260" r="2" fill="#999999"/>
  <text x="284" y="278" text-anchor="end" font-size="12" font-weight="bold" fill="#777777">default site</text>
  <text x="284" y="292" text-anchor="end" font-size="11" fill="#999999">wheel frame origin</text>

  <!-- the offset that moves it -->
  <line x1="300" y1="251" x2="300" y2="124" stroke="#9673a6" stroke-width="2"
        stroke-dasharray="6 4" marker-end="url(#m-o)"/>
  <text x="312" y="232" font-size="12" font-style="italic" fill="#7d5a91">command_site_position</text>

  <!-- axes at the moved site -->
  <line x1="300" y1="100" x2="300" y2="62" stroke="#d1403f" stroke-width="2.4" marker-end="url(#m-x)"/>
  <text x="300" y="52" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#d1403f">site +X</text>
  <line x1="290" y1="110" x2="246" y2="110" stroke="#4caf50" stroke-width="2.4" marker-end="url(#m-y)"/>
  <text x="266" y="100" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4caf50">+Y</text>
  <path d="M 322 136 A 34 34 0 0 0 332 98" fill="none" stroke="#3d7dd8"
        stroke-width="2.2" marker-end="url(#m-w)"/>
  
  <!-- the moved control site -->
  <circle cx="300" cy="110" r="11" fill="#ffffff" stroke="#d79b00" stroke-width="2.6"/>
  <circle cx="300" cy="110" r="3.6" fill="#d79b00"/>
  <text x="348" y="92" font-size="13.5" font-weight="bold" fill="#d79b00">control site</text>
  <text x="348" y="107" font-size="11" fill="#b08a4a">moved forward</text>
</svg>
