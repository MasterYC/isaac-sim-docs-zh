<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="448" viewBox="90 85 500 350"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="v-arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d1403f"/>
    </marker>
    <marker id="t-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a7a"/>
    </marker>
    <marker id="d-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#555555"/>
    </marker>
    <marker id="d-arr-s" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="90" y="85" width="500" height="350" fill="#ffffff"/>

  <!-- turn geometry -->
  <line x1="150" y1="109" x2="150" y2="300" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="150" y1="109" x2="310" y2="300" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- ICR -->
  <line x1="142" y1="109" x2="158" y2="109" stroke="#7a7a7a" stroke-width="1.8"/>
  <line x1="150" y1="101" x2="150" y2="117" stroke="#7a7a7a" stroke-width="1.8"/>
  <circle cx="150" cy="109" r="5" fill="none" stroke="#7a7a7a" stroke-width="1.8"/>
  <text x="164" y="104" font-size="12.5" font-weight="bold" fill="#666666">ICR</text>
  <text x="164" y="119" font-size="11.5" fill="#8a8a8a">lies on the non-steering (rear) axle</text>

  <!-- body -->
  <rect x="110" y="262" width="240" height="76" rx="12" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>

  <!-- axle lines -->
  <line x1="150" y1="253" x2="150" y2="347" stroke="#6c8ebf" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="310" y1="253" x2="310" y2="347" stroke="#6c8ebf" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- rear wheels (fixed) -->
  <rect x="133" y="247" width="34" height="16" rx="3" fill="#4d4d4d"/>
  <rect x="133" y="337" width="34" height="16" rx="3" fill="#4d4d4d"/>

  <!-- front wheels (steered, Ackermann: inner steers more) -->
  <rect x="293" y="247" width="34" height="16" rx="3" fill="#4d4d4d" transform="rotate(-47.7 310 255)"/>
  <rect x="293" y="337" width="34" height="16" rx="3" fill="#4d4d4d" transform="rotate(-34.2 310 345)"/>

  <!-- +X reference and theta -->
  <line x1="310" y1="300" x2="400" y2="300" stroke="#aaaaaa" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="406" y="304" font-size="11.5" fill="#999999">+X</text>
  <path d="M 365 300 A 55 55 0 0 0 352 265" fill="none" stroke="#7a7a7a" stroke-width="1.4" marker-end="url(#t-arr)"/>
  <text x="371" y="281" font-size="13" font-style="italic" fill="#666666">θ</text>

  <!-- commanded velocity at the control point -->
  <line x1="310" y1="300" x2="387" y2="236" stroke="#d1403f" stroke-width="2.4" marker-end="url(#v-arr)"/>
  <text x="395" y="230" font-size="12.5" font-weight="bold" fill="#d1403f">v = [v·cos θ, v·sin θ, 0]</text>
  <text x="395" y="245" font-size="11.5" fill="#999999">the commanded setpoint</text>

  <!-- control point -->
  <circle cx="310" cy="300" r="10" fill="#ffffff" stroke="#d79b00" stroke-width="2.6"/>
  <circle cx="310" cy="300" r="3.4" fill="#d79b00"/>
  <line x1="313" y1="309" x2="322" y2="356" stroke="#e0b060" stroke-width="1"/>
  <text x="318" y="370" font-size="13" font-weight="bold" fill="#d79b00">control_point</text>
  <text x="318" y="385" font-size="11.5" fill="#999999">midpoint of the steering (front) axle</text>

  <!-- wheel_base dimension -->
  <line x1="150" y1="356" x2="150" y2="416" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="310" y1="356" x2="310" y2="416" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="150" y1="408" x2="310" y2="408" stroke="#555555" stroke-width="1.3"
        marker-start="url(#d-arr-s)" marker-end="url(#d-arr)"/>
  <text x="230" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#555555">wheel_base (L)</text>
</svg>
